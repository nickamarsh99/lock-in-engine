<title>Lock-In Content Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* Layout: a working desk. Sticky top bar with sprint progress, four views (Sprint, Studio, Generate, Playbook), single column on phones. */
:root {
  --bg: #F2F3EE; --surface: #FFFFFF; --ink: #17231D; --muted: #5B6860; --line: #D9DED4;
  --pine: #2C5843; --pine-ink: #FFFFFF; --sun: #B98219; --sun-soft: #F4E6C6; --danger: #A8402F;
  --p1: #8A6AAE; --p2: #D19A2E; --p3: #4F9764; --p4: #C46B49; --p5: #4B79B3; --p6: #379C98; --p7: #BC5A82; --p8: #76818E;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1612; --surface: #17201B; --ink: #E7ECE4; --muted: #98A69D; --line: #29352E;
  --pine: #86BC9F; --pine-ink: #0F1612; --sun: #E2B04C; --sun-soft: #3A3019; --danger: #E2816E; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1612; --surface: #17201B; --ink: #E7ECE4; --muted: #98A69D; --line: #29352E;
  --pine: #86BC9F; --pine-ink: #0F1612; --sun: #E2B04C; --sun-soft: #3A3019; --danger: #E2816E; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: 1; margin: 0; text-wrap: balance }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto }
.sunmark { width: 26px; height: 26px; border-radius: 50%; background: var(--sun); box-shadow: inset 0 -9px 0 0 var(--pine) }
.brand h1 { font-size: 24px }
.brand small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .02em }
nav { display: flex; gap: 4px; overflow-x: auto; max-width: 100% }
nav a { text-decoration: none; color: var(--muted); font-weight: 600; padding: 7px 12px; border-radius: 999px; white-space: nowrap }
nav a[aria-current="page"] { background: var(--ink); color: var(--bg) }
.daybadge { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: .03em; white-space: nowrap }
.daybadge b { color: var(--sun) }

main { padding-block: 22px 60px }
.view { display: grid; gap: 22px }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.muted { color: var(--muted) }
.serif { font-family: var(--f-serif) }

/* Buttons and inputs */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600 }
.btn:hover { border-color: var(--ink) }
.btn.primary { background: var(--pine); color: var(--pine-ink); border-color: var(--pine) }
.btn.sun { background: var(--sun); color: #17231D; border-color: var(--sun) }
.btn.ghost { background: transparent }
.btn.small { padding: 4px 10px; font-size: 13px }
.btn.danger { color: var(--danger) }
.btn:disabled { opacity: .5; cursor: default }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted) }
label.f input, label.f select, label.f textarea { font-size: 15px; font-weight: 400; color: var(--ink) }
label.f .journal-text { font-size: 18px }
input[type=text], input[type=date], input[type=number], select, textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0 }
textarea { resize: vertical; line-height: 1.45 }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none }
.status { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px }
.st-idea { color: var(--muted); border: 1px dashed var(--muted) }
.st-drafted { background: var(--sun-soft); color: var(--ink) }
.st-ready { background: var(--pine); color: var(--pine-ink) }
.st-posted { background: var(--ink); color: var(--bg) }

/* Sprint */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px }
.stat .n { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums }
.stat .n small { font-size: 20px; color: var(--muted); font-weight: 600 }
.meter { height: 6px; background: var(--line); border-radius: 3px; margin-top: 10px; overflow: hidden }
.meter i { display: block; height: 100%; background: var(--sun) }
.two { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 22px; align-items: start }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr) } }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.cal .dow { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-align: center; text-transform: uppercase }
.cell { min-height: 92px; border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; text-align: left; min-width: 0 }
.cell.out { background: transparent; border-style: dashed; opacity: .45 }
.cell.today { border-color: var(--sun); box-shadow: 0 0 0 1px var(--sun) }
.cell .d { font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 4px }
.cell .t { font-size: 12.5px; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow-wrap: anywhere }
.cell.has { cursor: pointer; border-left-width: 4px }
.cell.has:hover { border-color: var(--ink) }
.cell .add { margin-top: auto; font-size: 12px; color: var(--muted); background: none; border: 1px dashed var(--line); border-radius: 6px; padding: 3px }
.cell .add:hover { color: var(--ink); border-color: var(--ink) }
@media (max-width: 620px) {
  .cal { grid-template-columns: minmax(0, 1fr) } .cal .dow { display: none } .cell.out { display: none }
  .cell { min-height: 0; flex-direction: row; align-items: center; gap: 10px } .cell .t { flex: 1 } .cell .add { margin: 0 0 0 auto; padding: 3px 10px }
}
.mix { display: grid; gap: 9px }
.mix .m { display: grid; grid-template-columns: 112px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 13px }
.mix .bar { position: relative; height: 10px; background: var(--bg); border-radius: 5px; border: 1px solid var(--line) }
.mix .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 5px }
.mix .bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink) }
.mix .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted) }
.cadence { display: grid; gap: 10px }
.cadence div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; font-size: 14px }
.cadence b { font-family: var(--f-display); text-transform: uppercase; font-size: 16px; letter-spacing: .03em }
.toplist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none }
.toplist li { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; font-size: 14px; border-bottom: 1px solid var(--line); padding-bottom: 6px }
.toplist span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap }

/* Studio */
.studio-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start }
@media (max-width: 900px) { .editor { grid-template-columns: minmax(0, 1fr) } }
.fields { display: grid; gap: 14px }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
@media (max-width: 520px) { .grid3 { grid-template-columns: minmax(0, 1fr) } }
.slide-ed { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line) }
.slide-ed .num { font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--sun); padding-top: 4px }
.slide-ed .stack { display: grid; gap: 6px }
.slide-ed .ops { display: grid; gap: 4px }
.slide-ed .ops button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 30px; height: 26px; font-size: 13px; line-height: 1 }
.previews { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory }
.previews figure { margin: 0; flex: none; width: 210px; scroll-snap-align: start; display: grid; gap: 4px }
.previews canvas, .previews img { width: 100%; height: auto; border-radius: 6px; display: block; border: 1px solid var(--line); aspect-ratio: 4 / 5 }
.previews figcaption { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted) }
.previews figcaption button { border: none; background: none; color: var(--pine); font-weight: 600; font-size: 12px; padding: 0 }
.themes { display: flex; gap: 6px }
.themes button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line) }
.themes button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset }
.out-block { display: grid; gap: 6px }
.out-block .row { justify-content: space-between }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.count.over { color: var(--danger); font-weight: 700 }
.checks { display: flex; flex-wrap: wrap; gap: 6px }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer }
.checks input { accent-color: var(--pine) }
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px }
@media (max-width: 520px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.saved { font-size: 12px; color: var(--muted) }
.hooks { display: grid; gap: 6px; margin-top: 6px }
.hooks button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-weight: 600 }
.hooks button:hover { border-color: var(--pine) }
.empty { text-align: center; padding: 40px 16px; color: var(--muted) }
.empty h2 { color: var(--ink); font-size: 30px; margin-bottom: 8px }

/* Generate */
.gen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 22px; align-items: start }
@media (max-width: 900px) { .gen { grid-template-columns: minmax(0, 1fr) } }
.angles { display: flex; flex-wrap: wrap; gap: 6px }
.angles button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 11px; font-size: 13px; text-align: left }
.angles button:hover { border-color: var(--pine); color: var(--pine) }
.result h3 { font-size: 26px; margin-bottom: 4px }
.result ol { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 8px }
.result ol li b { display: block }
.stream { font-family: var(--f-serif); white-space: pre-wrap; color: var(--muted); max-height: 260px; overflow: auto; font-size: 14px }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--sun); padding: 2px 0 2px 10px }
.err { color: var(--danger); font-weight: 600 }

/* Playbook */
.pb { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px }
.pb h2 { font-size: 26px; margin-bottom: 10px }
.pb ul, .pb ol { margin: 0; padding-left: 20px; display: grid; gap: 7px }
.pb p { margin: 0 0 10px }
.thesis { font-family: var(--f-serif); font-size: clamp(22px, 3.4vw, 34px); line-height: 1.25; max-width: 32ch; margin: 0 }
.thesis em { color: var(--sun) }
.lesson b { display: block }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
@media (max-width: 620px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.themes { flex-wrap: wrap; align-items: center }
.themes button.auto { width: auto; border-radius: 999px; padding: 0 12px; font-size: 13px; font-weight: 700; background: var(--bg) }

/* Teleprompter: deliberately one dark look, it's a filming tool held near a lens */
.prompter { position: fixed; inset: 0; z-index: 30; background: #0C0A09; color: #FFF4E6; display: grid; grid-template-rows: minmax(0, 1fr) auto }
.pr-scroll { overflow-y: auto; padding: 20vh max(20px, env(safe-area-inset-right, 0px)) 70vh max(20px, env(safe-area-inset-left, 0px)); scrollbar-width: none; cursor: pointer }
.pr-scroll::-webkit-scrollbar { display: none }
.pr-text { max-width: 30ch; margin: 0 auto; font-family: var(--f-ui); font-weight: 600; line-height: 1.32; font-size: var(--pr-size, 40px) }
.pr-text p { margin: 0 0 .7em }
.pr-text .cue { font-size: .5em; color: #F2A35E; letter-spacing: .06em; text-transform: uppercase; font-weight: 700 }
.pr-text .lbl { display: block; font-size: .42em; color: #F2A35E; letter-spacing: .14em; text-transform: uppercase; font-weight: 700 }
.prompter.mirror .pr-text { transform: scaleX(-1) }
.pr-line { position: fixed; left: 0; right: 0; top: 20vh; height: 2px; background: linear-gradient(90deg, transparent, rgba(242,163,94,.7), transparent); pointer-events: none }
.pr-count { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 30vh; color: #F2A35E; pointer-events: none }
.pr-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); background: #1A1512; border-top: 1px solid #2E2620; font-size: 14px }
.pr-bar button { background: #2A221D; color: #FFF4E6; border: 1px solid #3A2F27; border-radius: 8px; padding: 7px 12px; font-weight: 700; min-width: 40px }
.pr-bar button.go { background: #F2A35E; color: #1A1512; border-color: #F2A35E; min-width: 86px }
.pr-bar button[aria-pressed="true"] { border-color: #F2A35E; color: #F2A35E }
.pr-bar .grp { display: inline-flex; gap: 4px; align-items: center; color: #BFAF9F }
/* Content bank */
.runway { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 22px; align-items: center }
.runway .big { font-family: var(--f-display); font-weight: 800; font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums }
.runway .big small { display: block; font-size: 14px; letter-spacing: .1em; color: var(--muted); font-weight: 700 }
.runway .meter { height: 10px; margin-top: 8px }
.runway .meter i { transition: width .3s }
.runway.low .big { color: var(--danger) }
.runway.low .meter i { background: var(--danger) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600 }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start }
@media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 620px) { .board { grid-template-columns: minmax(0, 1fr) } .col[data-col="ready"] { order: -1 } }
.col { background: color-mix(in srgb, var(--surface) 55%, var(--bg)); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 10px; min-height: 120px }
.col.drop { border-color: var(--sun); box-shadow: inset 0 0 0 2px var(--sun-soft) }
.col-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 4px }
.col-h h3 { font-size: 19px }
.col-h .n { font-family: var(--f-display); font-weight: 700; color: var(--muted); font-size: 17px }
.bcard { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; cursor: grab }
.bcard.sel { border-color: var(--sun); box-shadow: 0 0 0 1px var(--sun) }
.bcard.dragging { opacity: .45 }
.bcard .thumb { width: 64px; aspect-ratio: 4 / 5; border-radius: 5px; display: block; background: var(--bg); border: 1px solid var(--line) }
.bcard .thumb.ph { display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 13px; color: var(--muted); text-transform: uppercase; text-align: center; padding: 4px; line-height: 1 }
.bcard .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase }
.bcard h4 { margin: 3px 0 2px; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere }
.bcard .hk { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.bcard .need { margin: 4px 0 0; font-size: 12px; color: var(--danger); font-weight: 600 }
.bcard .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.bcard .acts .btn { padding: 3px 9px; font-size: 12.5px }
.bcard .when { font-size: 12px; font-weight: 700; color: var(--pine); margin-left: auto }
.bcard input[type=checkbox] { accent-color: var(--sun); width: 16px; height: 16px }
.fmt { border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; font-size: 10px }
.busybar { display: flex; gap: 10px; align-items: center; background: var(--sun-soft); border-radius: var(--r); padding: 10px 14px; font-weight: 600 }

/* Inspire */
.ins { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start }
@media (max-width: 900px) { .ins { grid-template-columns: minmax(0, 1fr) } }
.journal-text { font-family: var(--f-serif); font-size: 18px; line-height: 1.6; min-height: 300px; background: var(--surface) }
.entries { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 560px; overflow: auto }
.entries button { width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px }
.entries button:hover { background: var(--bg) }
.entries button.sel { border-color: var(--sun); background: var(--sun-soft) }
.entries .d { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase }
.entries .l { font-family: var(--f-serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.idea-out { display: grid; gap: 8px }
.idea-out article { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: grid; gap: 4px; background: var(--bg) }
.swipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px }
.swipe-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto 1fr }
.swipe-card .shots { display: flex; gap: 2px; overflow-x: auto; background: var(--bg); scroll-snap-type: x mandatory }
.swipe-card .shots img { height: 240px; width: auto; max-width: none; flex: none; scroll-snap-align: start; display: block }
.swipe-card .body { padding: 12px 14px; display: grid; gap: 6px; font-size: 13.5px; align-content: start }
.swipe-card dl { margin: 0; display: grid; gap: 6px }
.swipe-card dt { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.swipe-card dd { margin: 0; overflow-wrap: anywhere }

/* Content tree */
.tree-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.tree-head input[type=search] { flex: 1 1 220px; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px }

function planPillars(emptyDates) {
  const counts = Object.fromEntries(PILLARS.map(p => [p.n, 0]));
  posts.filter(inSprint).forEach(p => counts[p.pillar] = (counts[p.pillar] || 0) + 1);
  let total = posts.filter(inSprint).length;
  return emptyDates.map(date => {
    total++;
    let best = PILLARS[0], gap = -Infinity;
    for (const p of PILLARS) { const g = p.target / 100 * total - counts[p.n]; if (g > gap) { gap = g; best = p; } }
    counts[best.n]++;
    return { date, pillar: best.n };
  });
}
function nextEmptyDate() {
  const taken = new Set(posts.map(p => p.date));
  return sprintDates().find(d => d >= TODAY && !taken.has(d)) || addDays(TODAY, 1);
}

function brief() {
  return `You write social content for a Christian holistic-health creator. Brand lens: helping people build a healthier, more faithful, more grounded life under Jesus through real food, created rhythms, strength, home, community, and purposeful work.
Who it's for: ${settings.niche}
He stands for: ${STANDS_FOR}.
He stands against: ${STANDS_AGAINST}.
Voice: first person, plain, warm, direct, like a brother who's a few steps ahead. Conviction without self-righteousness. Faith is woven into the worldview, not tacked on. Short sentences. No cursing, no insults, no mocking people. No hype words, no emoji walls, no fake urgency.

Growth rules (from Bloom's playbook): grow the community, not a sale. Speak to one specific person. Every post should be worth saving or sending to a friend.${voiceBlock()}`;

// His own approved and best-performing posts are the strongest voice signal, so they ride along with every request.
function voiceExamples(max = 5) {
  const done = posts.filter(p => (p.status === "posted" || p.status === "ready") && p.caption);
  const best = done.filter(p => p.status === "posted").sort((a, b) => score(b) - score(a));
  const recent = done.filter(p => !best.slice(0, 3).includes(p)).sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
  return [...best.slice(0, 3), ...recent].slice(0, max);
}
function voiceBlock() {
  const ex = voiceExamples();
  return (voice.notes ? `\n\nHIS VOICE GUIDE (learned from his edits; follow it closely):\n${voice.notes}` : "") +
    (ex.length ? `\n\nPOSTS HE APPROVED (match this voice, don't copy the topics):\n${ex.map(p => `- Hook: ${p.hook}\n  Caption: ${p.caption.slice(0, 420).replace(/\n+/g, " / ")}`).join("\n")}` : "");
}

function postPrompt({ pillar, angle, title, hook, product, format = "carousel", model }) {
  const p = P[pillar];
  return `${brief()}

Pillar: ${p.name}. Purpose: ${p.purpose}

${angle ? `Angle: ${angle}` : ""}${title ? `\nWorking title: ${title}` : ""}${hook ? `\nHook to build on: ${hook}` : ""}

${SHAPES[format] || SHAPE}`;

function cleanPost(r) {
  const s = Array.isArray(r?.slides) ? r.slides.filter(x => x && (x.h || x.b)).map(x => ({ h: String(x.h || ""), b: String(x.b || "") })) : [];
  return { title: String(r?.title || ""), hook: String(r?.hook || s[0]?.h || ""), slides: s, caption: String(r?.caption || ""),
    hashtags: (Array.isArray(r?.hashtags) ? r.hashtags : []).map(h => String(h).replace(/^#/, "")).slice(0, 6),
    script: String(r?.script || ""), xpost: String(r?.xpost || "") };
}
function sampleError(e) {
  if (e?.code === "not_granted") return "Claude access was declined for this page. Allow it from the page's Permissions menu to generate.";
  if (e?.code === "rate_limited") return "Claude is rate-limited right now. Wait a minute, then try again.";
  if (e?.code === "invalid_json") return "Claude's answer came back malformed. Try again.";
  return e?.message || "Generation failed. Try again.";
}

async function fillEmptyDays(btn) {
  if (!sampleFn) { toast("Open on claude.ai to generate"); return; }
  const taken = new Set(posts.map(p => p.date));
  const empties = sprintDates().filter(d => d >= TODAY && !taken.has(d));
  if (!empties.length) return;
  const plan = planPillars(empties);
  const existing = posts.filter(p => p.title).map(p => "- " + p.title).join("\n");
  btn.disabled = true; btn.textContent = "Planning…";
  try {
    const r = await sampleFn.json(`${brief()}

Plan post ideas for these calendar slots. Each slot has a fixed pillar; write one strong idea per slot.
${plan.map(s => `${s.date} | pillar ${s.pillar}: ${P[s.pillar].name}`).join("\n")}

Pillar sub-topics:
${PILLARS.map(p => `${p.n}. ${p.subs.join("; ")}`).join("\n")}

Already planned (don't repeat):
${existing || "(none)"}

Reply with only a JSON array: [{"date": "YYYY-MM-DD", "pillar": 3, "title": "internal name, max 8 words", "hook": "scroll-stopping first line, max 12 words"}]`, { modelTier: "complex", cache: false });
    const valid = new Map(plan.map(s => [s.date, s.pillar]));

async function uploadSlidePhoto(file, i) {

    const a = await assets.upload(file);
    if (draft?.id !== id || !draft.slides[i]) return;
    draft.slides[i].photo = a.url; await store.save(structuredClone(draft)); renderSlideEditors(); drawPreviews(); toast(`Photo added to slide ${i + 1}`);

async function uploadCover(file) {
  if (!file) return;

    const a = await assets.upload(file);

async function draftWithClaude(btn) {
  btn.disabled = true; btn.textContent = "Drafting…";

    const r = cleanPost(await sampleFn.json(postPrompt({ pillar: draft.pillar, title: draft.title, hook: draft.hook, format: draft.format || "carousel" }), { modelTier: "complex", cache: false }));

function drawSlide(cv, post, i) {

  const slides = post.slides, n = slides.length, s = slides[i] || { h: "", b: "" };
  const photoUrl = s.photo || (i === 0 ? post.cover : null), photo = photoUrl ? imgCache[photoUrl] : null;
  const base = THEMES[themeKey(post)];
  const T = photo ? { ...base, fg: "#FFF6EA", soft: "rgba(255,246,234,.85)", accent: base.serif ? "#E9C08A" : base.accent, foot: null } : base;

  const display = sz => sf ? `500 ${sz}px "Newsreader", Georgia, serif` : `800 ${sz}px "Barlow Condensed", "Arial Narrow", sans-serif`;
  const bold = sz => sf ? `500 ${sz}px "Newsreader", Georgia, serif` : `700 ${sz}px "Barlow Condensed", "Arial Narrow", sans-serif`;
  const serif = (sz, it) => `${it ? "italic " : ""}400 ${sz}px "Newsreader", Georgia, serif`;
  const ui = sz => `700 ${sz}px "Barlow", system-ui, sans-serif`;
  ctx.textBaseline = "alphabetic"; spaced(ctx, 0);
  if (photo) paintPhoto(ctx, photo, i > 0 || post.format === "quote"); else paintBackground(ctx, T, i);
  const maxW = W - M * 2;
  const footer = right => {
    ctx.font = ui(28); spaced(ctx, 1.5); ctx.fillStyle = T.foot || T.soft;
    ctx.textAlign = "left"; ctx.fillText(settings.handle || "", M, H - 78);
    ctx.textAlign = "right"; ctx.fillText(right, W - M, H - 78); ctx.textAlign = "left"; spaced(ctx, 0);
    ctx.fillStyle = T.foot || T.accent; ctx.fillRect(M, H - 130, 64, 4);
  };
  if (post.format === "quote") {
    // Mindset statement: one thought, set like a page from a journal.
    const q = fit(ctx, s.h || post.hook || "", sz => `500 ${sz}px "Newsreader", Georgia, serif`, maxW, 720, 100, 50, 1.18);
    const attr = s.b ? s.b.toUpperCase() : "";
    const blockH = 130 + q.ls.length * q.s * 1.18 + (attr ? 90 : 0);
    let y = Math.max(200, (H - 150 - blockH) / 2 + 30);
    ctx.font = `500 230px "Newsreader", Georgia, serif`; ctx.fillStyle = T.accent; ctx.fillText("“", M - 8, y + 150); y += 160;
    ctx.font = `500 ${q.s}px "Newsreader", Georgia, serif`; ctx.fillStyle = T.fg;
    q.ls.forEach(l => { y += q.s * 1.18; ctx.fillText(l, M, y - q.s * 0.25); });
    if (attr) { y += 70; ctx.font = ui(28); spaced(ctx, 4); ctx.fillStyle = T.accent; ctx.fillText(attr.slice(0, 48), M, y); spaced(ctx, 0); }
    footer(n > 1 ? `${i + 1} / ${n}` : "");
    return;
  }
  if (i === 0) {
    ctx.font = ui(28); spaced(ctx, 5); ctx.fillStyle = T.accent;
    ctx.fillText((P[post.pillar]?.short || "").toUpperCase(), M, 186); spaced(ctx, 0);
    const head = fit(ctx, up(s.h || post.hook || ""), display, maxW, 640, sf ? 132 : 168, sf ? 64 : 80, lhD);
    const sub = s.b ? fit(ctx, s.b, sz => serif(sz, true), maxW, 220, 50, 34, 1.3) : { s: 0, ls: [] };
    const blockH = head.ls.length * head.s * lhD + (sub.ls.length ? 44 + sub.ls.length * sub.s * 1.3 : 0);
    // With a photo, text sits low so the image reads first.
    let y = (photo ? Math.max(330, H - 190 - blockH) : Math.max(330, (H - 170 - blockH) / 2 + 120)) + head.s * 0.8;
    ctx.font = display(head.s); ctx.fillStyle = T.fg;
    head.ls.forEach(l => { ctx.fillText(l, M, y); y += head.s * lhD; });
    if (sub.ls.length) { y += 44 - head.s * lhD + sub.s * 1.1; ctx.font = serif(sub.s, true); ctx.fillStyle = T.soft; sub.ls.forEach(l => { ctx.fillText(l, M, y); y += sub.s * 1.3; }); }
    footer(n > 1 ? "SWIPE  →" : "");
    return;
  }
  const last = i === n - 1 && n > 2;
  // Measure first so short slides sit in the optical center instead of hugging the top.
  const headFont = sz => (last ? display(sz) : bold(sz));
  const mHead = fit(ctx, up(s.h || ""), headFont, maxW, last ? 420 : 330, last ? 130 : 100, 56, 0.98);
  const topH = last ? 90 : 175;
  const roomEst = H - 170 - (150 + topH + mHead.ls.length * mHead.s * 0.98 + 34);
  const mBody = s.b && roomEst > 60 ? fit(ctx, s.b, sz => serif(sz, last), maxW, roomEst, 48, 30, 1.38) : null;
  const total = topH + mHead.ls.length * mHead.s * 0.98 + (mBody ? 34 + mBody.ls.length * mBody.s * 1.38 : 0);
  let y = Math.max(150, Math.round((H - 170 - 150 - total) * 0.42) + 150);
  if (!last) {
    ctx.font = sf ? `italic 400 140px "Newsreader", Georgia, serif` : display(150); ctx.fillStyle = T.accent; ctx.fillText(pad(i), M - 6, y + 105); y += 175;
  } else {
    ctx.font = ui(28); spaced(ctx, 5); ctx.fillStyle = T.accent; ctx.fillText("BEFORE YOU GO", M, y + 36); spaced(ctx, 0); y += 90;
  }
  const head = fit(ctx, up(s.h || ""), headFont, maxW, last ? 420 : 330, last ? 130 : 100, 56, 0.98);
  ctx.font = headFont(head.s); ctx.fillStyle = T.fg;
  y += head.s * 0.82; head.ls.forEach(l => { ctx.fillText(l, M, y); y += head.s * 0.98; });
  y += 40 - head.s * 0.68;
  const room = H - 170 - y;
  if (s.b && room > 60) {
    const body = fit(ctx, s.b, sz => serif(sz, last), maxW, room, 48, 30, 1.38);
    ctx.font = serif(body.s, last); ctx.fillStyle = last ? T.soft : T.fg; y += body.s;
    body.ls.forEach(l => { ctx.fillText(l, M, y); y += body.s * 1.38; });
  }
  footer(`${i + 1} / ${n}`);
}
async function drawPreviews() {
  const box = $("#e-previews"); if (!box || !draft) return;
  await preload(draft);

  box.innerHTML = draft.slides.map((_, i) => `<figure><canvas width="${W}" height="${H}" aria-label="Slide ${i + 1} preview"></canvas><figcaption><span>Slide ${i + 1}</span><button data-save="${i}">Save PNG</button></figcaption></figure>`).join("");
  box.querySelectorAll("canvas").forEach((cv, i) => drawSlide(cv, draft, i));
}
function slideBlob(i) {
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; drawSlide(cv, draft, i);
  return new Promise(r => cv.toBlob(r, "image/png"));
}
const slug = () => (draft.title || "post").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "post";
async function offer(filename, blob) {
  if (downloads) {
    try { await downloads.save({ filename, data: blob }); toast("Saved " + filename); return; }
    catch (e) {
      if (e?.code === "declined") return;
      if (e?.code === "rate_limited") { toast("A save prompt is already open"); return; }
    }

  const url = URL.createObjectURL(blob);
  const box = $("#e-previews"); const fig = document.createElement("figure");
  fig.innerHTML = blob.type === "image/png" ? `<img src="${url}" alt="${esc(filename)}"><figcaption>Long-press or right-click to save</figcaption>` : `<figcaption>Download is not available here. Save slides one at a time.</figcaption>`;
  box.prepend(fig); toast("Saving files isn't available here");
}

/* ---------- Teleprompter ---------- */
const pr = { speed: 3, size: 40, playing: false, last: 0, raf: 0, lock: null, countdown: 0 };
try { Object.assign(pr, JSON.parse(localStorage.getItem("lie-prompter") || "{}"), { playing: false }); } catch {}
function scriptHtml(text) {
  return String(text || "").split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const cue = l.match(/^\[\s*(on screen|b-roll):?\s*(.*?)\]$/i);
    if (cue) return `<p class="cue">${/b-roll/i.test(cue[1]) ? "B-roll" : "On screen"} · ${esc(cue[2])}</p>`;
    const lab = l.match(/^(HOOK|CTA)\s*(\([^)]*\))?\s*:\s*(.*)$/i);
    if (lab) return `<p><span class="lbl">${esc(lab[1])}</span>${esc(lab[3])}</p>`;
    return `<p>${esc(l)}</p>`;
  }).join("");
}
function prSettings() {
  $("#pr-text").style.setProperty("--pr-size", pr.size + "px"); $("#pr-speed").textContent = pr.speed;
  try { localStorage.setItem("lie-prompter", JSON.stringify({ speed: pr.speed, size: pr.size, mirror: pr.mirror })); } catch {}
}
function openPrompter(text) {
  if (!String(text || "").trim()) { toast("Write or draft a script first"); return; }
  $("#pr-text").innerHTML = scriptHtml(text);
  const box = $("#prompter"); box.hidden = false; box.classList.toggle("mirror", !!pr.mirror);
  $("#pr-mirror").setAttribute("aria-pressed", !!pr.mirror);
  $("#pr-scroll").scrollTop = 0; prSettings(); prStop();
  document.body.style.overflow = "hidden";
  navigator.wakeLock?.request("screen").then(l => pr.lock = l).catch(() => {});
}
function closePrompter() { prStop(); clearInterval(pr.countdown); $("#pr-count").hidden = true; $("#prompter").hidden = true; document.body.style.overflow = ""; pr.lock?.release?.().catch(() => {}); pr.lock = null; }
function prStop() { pr.playing = false; cancelAnimationFrame(pr.raf); $("#pr-play").textContent = "Start"; }
function prTick(t) {
  if (!pr.playing) return;
  const sc = $("#pr-scroll"), dt = pr.last ? (t - pr.last) / 1000 : 0; pr.last = t;
  sc.scrollTop += pr.speed * 16 * dt;
  if (sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2) { prStop(); return; }
  pr.raf = requestAnimationFrame(prTick);
}
function prPlay() {
  if (pr.playing) { prStop(); return; }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let n = reduce ? 0 : 3; const c = $("#pr-count");
  const go = () => { c.hidden = true; pr.playing = true; pr.last = 0; $("#pr-play").textContent = "Pause"; pr.raf = requestAnimationFrame(prTick); };
  if (!n) return go();
  c.hidden = false; c.textContent = n; $("#pr-play").textContent = "…";
  clearInterval(pr.countdown);
  pr.countdown = setInterval(() => { n--; if (n <= 0) { clearInterval(pr.countdown); go(); } else c.textContent = n; }, 800);
}
$("#prompter").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) { if (e.target.closest("#pr-scroll")) prPlay(); return; }
  if (b.id === "pr-play") prPlay();
  else if (b.id === "pr-close") closePrompter();
  else if (b.id === "pr-restart") { prStop(); $("#pr-scroll").scrollTop = 0; }
  else if (b.id === "pr-mirror") { pr.mirror = !pr.mirror; b.setAttribute("aria-pressed", pr.mirror); $("#prompter").classList.toggle("mirror", pr.mirror); prSettings(); }
  else if (b.dataset.pr) {
    const [k, d] = b.dataset.pr.split(","); const dir = Number(d);
    if (k === "speed") pr.speed = Math.min(10, Math.max(1, pr.speed + dir)); else pr.size = Math.min(72, Math.max(24, pr.size + dir * 4));
    prSettings();
  }
});
document.addEventListener("keydown", e => {
  if ($("#prompter").hidden) return;
  if (e.key === "Escape") closePrompter();
  else if (e.key === " " && e.target === document.body) { e.preventDefault(); prPlay(); }
});

async function batchDraft(ids) {

  for (const id of ids) {

    const p = posts.find(x => x.id === id); if (!p || p.status !== "idea") continue;
    bankBusy = `Drafting ${done + failed + 1} of ${ids.length}: ${p.title || p.hook}`; renderBank();
    try { await draftPost(p, bankAbort.signal); done++; bankSel.delete(id); }
    catch (e) { if (e?.code === "aborted" || e?.name === "AbortError") break; failed++; if (e?.code === "rate_limited" || e?.code === "not_granted") { toast(sampleError(e)); break; } }

async function planIdeas() {

  const plan = [];
  for (let k = 0; k < n; k++) { let best = PILLARS[0], gap = -Infinity; for (const p of PILLARS) { const g = p.target / 100 * (total + k + 1) - counts[p.n]; if (g > gap) { gap = g; best = p; } } counts[best.n]++; plan.push(best.n); }
  const fmts = ["carousel", "carousel", "quote", "carousel", "reel", "carousel", "quote", "carousel", "text", "reel"];
  const unused = tree.filter(t => t.kind === "idea" && !t.postId).slice(0, 60);
  const swipeNotes = swipe.filter(x => x.analysis?.structure).slice(0, 6).map(x => `- ${x.analysis.format}: ${x.analysis.structure}`).join("\n");
  bankBusy = "Planning 10 ideas from your pillars and content tree…"; renderBank();

    const r = await sampleFn.json(`${brief()}

Plan ${n} post ideas for his content bank. Use these pillar and format slots, in order:
${plan.map((pl, i) => `${i + 1}. pillar ${pl} (${P[pl].name}), format ${fmts[i]}`).join("\n")}

Ideas from his content tree he hasn't used yet (prefer these when one fits a slot; return its id as treeId):
${unused.map(t => `${t.id}: ${t.label}${t.note ? ` (${t.note.slice(0, 80)})` : ""}`).join("\n") || "(none)"}
${swipeNotes ? `\nPost structures he admires (borrow structure, never topics or words):\n${swipeNotes}` : ""}
Already in the bank (don't repeat): ${posts.slice(-60).map(p => p.title).filter(Boolean).join("; ")}

Formats: carousel = teaching slides; quote = one mindset or faith statement on a single image; reel = video-first; text = X/Threads post.
Reply with only a JSON array: [{"pillar": 3, "format": "carousel", "title": "max 8 words", "hook": "max 12 words", "angle": "one sentence on what the post says", "treeId": "t012 or empty"}]`, { modelTier: "complex", cache: false });
    let added = 0;
    for (const [i, x] of (Array.isArray(r) ? r : []).entries()) {
      if (!x?.title) continue;
      const id = uid();
      await store.save({ ...blankPost(), id, pillar: P[x.pillar] ? Number(x.pillar) : plan[i] || 2, format: FORMATS[x.format] ? x.format : fmts[i] || "carousel", title: String(x.title), hook: String(x.hook || ""), angle: String(x.angle || "") });
      const t = x.treeId && tree.find(n => n.id === x.treeId);
      if (t) await store.saveNode({ ...structuredClone(t), postId: id });
      added++;

}

    try { await store.saveNode(structuredClone(n)); const s2 = $("#tn-saved"); if (s2) s2.textContent = "Saved"; }
    catch { const s2 = $("#tn-saved"); if (s2) s2.textContent = "Not saved. Check your connection."; }
    if (redraw) drawTree();
  }, 500);
}
function childKind(parent) {
  if (!parent) return "branch";
  if (parent.kind === "pillar") return "idea";
  const sib = tree.find(x => x.parent === parent.id);
  return sib?.kind || (parent.kind === "branch" ? "topic" : parent.kind === "topic" ? "idea" : parent.kind);
}
async function addNode(parentId, afterOrder) {
  const parent = parentId ? byId(parentId) : null, sibs = tree.filter(x => (x.parent || null) === (parentId || null));
  const order = afterOrder ?? (sibs.reduce((m, x) => Math.max(m, x.order ?? 0), 0) + 1);
  const n = { id: uid().replace("p", "n"), parent: parentId || null, label: parent ? "New idea" : "New branch", kind: childKind(parent), note: "", url: "", order };
  if (parentId) treeCollapsed?.delete(parentId);
  treeSel = n.id; saveTreeUi();
  try { await store.saveNode(n); } catch { toast("Couldn't add it. You may have view-only access."); return; }
  if (storeMode !== "db") { tree = tree.some(x => x.id === n.id) ? tree : [...tree, n]; }
  drawTree(); renderTreeEditor();
  const inp = $("#tn-label"); if (inp) { inp.focus(); inp.select(); }
}
const tv = $("#v-tree");
tv.addEventListener("input", e => {
  const t = e.target, n = byId(treeSel);
  if (t.id === "tree-q") { treeQuery = t.value; treeFitted = !treeQuery ? false : treeFitted; drawTree(); return; }
  if (!n) return;
  if (t.id === "tn-label") { n.label = t.value; queueNodeSave(n, true); }
  else if (t.id === "tn-note") { n.note = t.value; queueNodeSave(n); }
  else if (t.id === "tn-url") { n.url = t.value.trim(); queueNodeSave(n); }
});
tv.addEventListener("change", async e => {
  const t = e.target, n = byId(treeSel); if (!n) return;
  if (t.id === "tn-kind") { n.kind = t.value; queueNodeSave(n, true); }
  else if (t.id === "tn-pillar") { n.pillar = t.value ? Number(t.value) : null; queueNodeSave(n, true); }
  else if (t.id === "tn-move" && t.value) {
    n.parent = t.value === "__top" ? null : t.value; n.order = tree.filter(x => x.parent === n.parent).reduce((m, x) => Math.max(m, x.order ?? 0), 0) + 1;
    if (n.parent) treeCollapsed?.delete(n.parent);
    await store.saveNode(structuredClone(n)); toast("Moved"); drawTree(); renderTreeEditor();
  }
});
tv.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const n = byId(treeSel);
  if (b.dataset.tmode) { treeMode = b.dataset.tmode; saveTreeUi(); renderTree(); }
  else if (b.dataset.ttog) toggleNode(b.dataset.ttog);
  else if (b.dataset.tsel) selectNode(b.dataset.tsel === "root" ? null : b.dataset.tsel);
  else if (b.id === "tree-expand") { treeCollapsed = new Set(); saveTreeUi(); treeFitted = false; drawTree(); }
  else if (b.id === "tree-collapse") { treeCollapsed = new Set(tree.filter(x => tree.some(c => c.parent === x.id)).map(x => x.id)); saveTreeUi(); treeFitted = false; drawTree(); }
  else if (b.id === "tree-addtop" || b.id === "tree-addtop2") addNode(null);
  else if (b.id === "tree-fit") fitTree();
  else if (b.id === "tree-zin" || b.id === "tree-zout") d3.select("#tree-map svg").transition().duration(200).call(treeZoom.scaleBy, b.id === "tree-zin" ? 1.3 : 1 / 1.3);
  else if (!n) return;
  else if (b.id === "tn-child") addNode(n.id);
  else if (b.id === "tn-sib") addNode(n.parent, (n.order ?? 0) + 0.5);
  else if (b.id === "tn-up" || b.id === "tn-down") {
    const sibs = tree.filter(x => (x.parent || null) === (n.parent || null)).sort((a, c) => (a.order ?? 0) - (c.order ?? 0));
    const i = sibs.indexOf(n), j = i + (b.id === "tn-up" ? -1 : 1); if (!sibs[j]) return;
    [sibs[i], sibs[j]] = [sibs[j], sibs[i]];
    for (let k = 0; k < sibs.length; k++) if (sibs[k].order !== k + 1) { sibs[k].order = k + 1; await store.saveNode(structuredClone(sibs[k])); }
    drawTree();
  }
  else if (b.id === "tn-draft") {
    genState = { ...genState, pillar: nodePillar(n) || genState.pillar, angle: n.label + (n.note ? `\n${n.note}` : ""), date: nextEmptyDate(), result: null, error: "" };
    go("generate");
  }
  else if (b.id === "tn-open") { selectedId = n.postId; draft = null; go("studio"); }
  else if (b.id === "tn-del") $("#tn-delconfirm").hidden = false;
  else if (b.id === "tn-delno") $("#tn-delconfirm").hidden = true;
  else if (b.id === "tn-delyes") {
    const all = [...descendants(n.id).reverse(), n]; treeSel = n.parent || null;
    try { for (const x of all) await store.removeNode(x.id); toast(`Deleted ${all.length} item${all.length > 1 ? "s" : ""}`); }
    catch { toast("Couldn't delete. You may have view-only access."); }
    drawTree(); renderTreeEditor();
  }
});
tv.addEventListener("keydown", e => {
  if (e.target.id !== "tree-q" || e.key !== "Enter") return;
  const q = treeQuery.trim().toLowerCase(); if (!q) return;
  const hit = tree.find(n => `${n.label} ${n.note || ""}`.toLowerCase().includes(q));
  if (hit) selectNode(hit.id, true); else toast("Nothing matches that search");
});
window.addEventListener("resize", () => { if (view === "tree" && treeMode === "map") { treeFitted = false; drawTree(); } });

/* ---------- Boot ---------- */
renderPlaybook();
route();
onData();
store.init();
</script>
